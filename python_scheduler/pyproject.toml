[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-scheduler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]

[project.scripts]
academic-scheduler = "academic_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
